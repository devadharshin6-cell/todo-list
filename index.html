<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <h1>My To-Do List</h1>
    <p class="subtitle" id="taskCount">No tasks yet</p>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="What do you need to do?" autocomplete="off">
      <button id="addBtn">Add Task</button>
    </div>

    <p class="error" id="errorMsg"></p>

    <ul id="taskList"></ul>

    <p class="empty" id="emptyMsg">Nothing here yet. Type a task above and press Add Task.</p>

    <button id="clearBtn" class="clear-btn">Clear All</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
